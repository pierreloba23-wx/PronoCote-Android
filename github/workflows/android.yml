
name: Build PronoCote Pro Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dependances Android
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev \
            libssl-dev build-essential

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "Cython<3" virtualenv

      - name: Compiler l'application Android
        run: buildozer -v android debug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: PronoCote-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
